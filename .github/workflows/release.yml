name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install fftw ncurses
      - run: make -j4 MARCH=
      - name: Package
        run: |
          name="scmp-${GITHUB_REF_NAME}-macos-$(uname -m)"
          mkdir "$name"
          cp build/scmp build/scmp-spotify README.md LICENSE "$name/"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" scmp-*.tar.gz scmp-*.tar.gz.sha256 --clobber
